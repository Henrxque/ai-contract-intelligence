[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-contract-intelligence"
version = "0.2.0"
description = "Evidence-backed contract extraction, deterministic validation, and review-ready exports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<8",
  "openai>=2,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "reportlab>=4,<5", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "samples/*.pdf", "sql/*.sql", "benchmark/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
